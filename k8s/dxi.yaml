apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-dashboard-collector-dxi-config
  labels:
    app: backup-dashboard-collector
    collector-group: dxi
data:
  collector.yaml: |
    app:
      name: backup-dashboard-collector-dxi
      log_level: INFO
    elasticsearch:
      enabled: false
      hosts:
        - https://elasticsearch:9200
      index_prefix: backup-dashboard
      username_file: /app/secrets/elasticsearch/username
      password_file: /app/secrets/elasticsearch/password
      verify_certs: true
      ca_certs: /app/secrets/elasticsearch/ca.crt
    collectors:
      - name: DXi_1
        type: DXi
        protocol: cli
        enabled: true
        schedule:
          interval_minutes: 5
          minute_offset: 0
          second: 0
        host: DXi_1_host_TO_BE_FILLED
        ssh_port: 22
        ssh_key_path: /app/secrets/ssh/id_ed25519
        ssh_known_hosts_path: /app/secrets/ssh/known_hosts
        jump_host: relay_host_TO_BE_FILLED
        jump_port: 22
        jump_username: "123456789"
        jump_ssh_key_path: /app/secrets/ssh/id_ed25519
        username: root
        command_timeout: 30
        commands:
          common_components: "syscli --getstatus commoncomponent"
          storage_arrays: "syscli --getstatus storagearray"
          system_board: "syscli --getstatus systemboard"
          capacity: "syscli --get diskusage"
          dedup: "syscli --get datareductionstat"
          vtls: "syscli --list vtl"
          interfaces: "syscli --getstatus networkport"
          network_config: "syscli --show netcfg"
          admin_alerts: "syscli --list adminalert"
          service_tickets: "syscli --list serviceticket --open"
      - name: DXi_2
        type: DXi
        protocol: cli
        enabled: true
        schedule:
          interval_minutes: 5
          minute_offset: 0
          second: 0
        host: DXi_2_host_TO_BE_FILLED
        ssh_port: 22
        ssh_key_path: /app/secrets/ssh/id_ed25519
        ssh_known_hosts_path: /app/secrets/ssh/known_hosts
        jump_host: relay_host_TO_BE_FILLED
        jump_port: 22
        jump_username: "123456789"
        jump_ssh_key_path: /app/secrets/ssh/id_ed25519
        username: root
        command_timeout: 30
        commands:
          common_components: "syscli --getstatus commoncomponent"
          storage_arrays: "syscli --getstatus storagearray"
          system_board: "syscli --getstatus systemboard"
          capacity: "syscli --get diskusage"
          dedup: "syscli --get datareductionstat"
          vtls: "syscli --list vtl"
          interfaces: "syscli --getstatus networkport"
          network_config: "syscli --show netcfg"
          admin_alerts: "syscli --list adminalert"
          service_tickets: "syscli --list serviceticket --open"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-dashboard-collector-dxi
  labels:
    app: backup-dashboard-collector
    collector-group: dxi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backup-dashboard-collector
      collector-group: dxi
  template:
    metadata:
      labels:
        app: backup-dashboard-collector
        collector-group: dxi
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: collector
          image: backup-dashboard-collector-dxi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_CONFIG
              value: /app/config/collector.yaml
          volumeMounts:
            - name: config
              mountPath: /app/config/collector.yaml
              subPath: collector.yaml
            - name: secrets
              mountPath: /app/secrets
              readOnly: true
            - name: bakmon-ssh-key
              mountPath: /app/secrets/ssh/id_ed25519
              readOnly: true
            - name: bakmon-known-hosts
              mountPath: /app/secrets/ssh/known_hosts
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: backup-dashboard-collector-dxi-config
        - name: secrets
          secret:
            secretName: backup-dashboard-collector-dxi-secrets
            items:
              - key: elasticsearch-username
                path: elasticsearch/username
              - key: elasticsearch-password
                path: elasticsearch/password
              - key: elasticsearch-ca.crt
                path: elasticsearch/ca.crt
        - name: bakmon-ssh-key
          hostPath:
            path: /home/bakmon/.ssh/id_ed25519
            type: File
        - name: bakmon-known-hosts
          hostPath:
            path: /home/bakmon/.ssh/known_hosts
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: backup-dashboard-collector-dxi
  labels:
    app: backup-dashboard-collector
    collector-group: dxi
spec:
  selector:
    app: backup-dashboard-collector
    collector-group: dxi
  ports:
    - name: http
      port: 8080
      targetPort: http

