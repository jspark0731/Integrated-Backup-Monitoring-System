apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-dashboard-collector-networker-chnl-config
  labels:
    app: backup-dashboard-collector
    collector-group: networker
    networker-server: chnl
data:
  collector.yaml: |
    app:
      name: backup-dashboard-collector-networker-chnl
      log_level: INFO
    elasticsearch:
      enabled: false
      hosts: [https://elasticsearch:9200]
      username_file: /apps/secrets/elasticsearch/username
      password_file: /apps/secrets/elasticsearch/password
      verify_certs: true
      ca_certs: /apps/secrets/elasticsearch/ca.crt
    collectors:
      - name: networker_chnl
        type: Networker
        protocol: rest
        enabled: true
        schedule:
          jobs: {interval_minutes: 5, minute_offset: 1, second: 20}
          backups: {interval_minutes: 15, minute_offset: 9, second: 20}
          inventory: {interval_minutes: 60, minute_offset: 18, second: 20}
        base_url: networker_chnl_base_url_TO_BE_FILLED
        username_file: /apps/secrets/networker/chnl/username
        password_file: /apps/secrets/networker/chnl/password
        verify_tls: true
        ca_certs: /apps/secrets/networker/chnl/ca.crt
        rest:
          max_concurrency: 1
          request_spacing_seconds: 30
          jobs_query_window_minutes: 10
          backups_query_window_minutes: 20
          field_filter: true
        source_networker: chnl
        classification:
          hostname_csv_path: /apps/config/hostname_domain.csv
          allowed_domains: [core, chnl, info]
          unmapped_domain: unmapped
  hostname_domain.csv: |
    hostname,security_domain
    networker_core_client_hostname_TO_BE_FILLED,core
    networker_chnl_client_hostname_TO_BE_FILLED,chnl
    networker_info_client_hostname_TO_BE_FILLED,info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-dashboard-collector-networker-chnl
  labels:
    app: backup-dashboard-collector
    collector-group: networker
    networker-server: chnl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backup-dashboard-collector
      collector-group: networker
      networker-server: chnl
  template:
    metadata:
      labels:
        app: backup-dashboard-collector
        collector-group: networker
        networker-server: chnl
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      hostAliases:
        - ip: networker_chnl_ip_TO_BE_FILLED
          hostnames: [networker_chnl_hostname_TO_BE_FILLED]
      containers:
        - name: collector
          image: backup-dashboard-collector-networker:latest
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: APP_CONFIG, value: /apps/config/collector.yaml}
          volumeMounts:
            - {name: config, mountPath: /apps/config/collector.yaml, subPath: collector.yaml, readOnly: true}
            - {name: config, mountPath: /apps/config/hostname_domain.csv, subPath: hostname_domain.csv, readOnly: true}
            - {name: secrets, mountPath: /apps/secrets, readOnly: true}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: config
          configMap:
            name: backup-dashboard-collector-networker-chnl-config
        - name: secrets
          secret:
            secretName: backup-dashboard-collector-networker-secrets
            items:
              - {key: elasticsearch-username, path: elasticsearch/username}
              - {key: elasticsearch-password, path: elasticsearch/password}
              - {key: elasticsearch-ca-crt, path: elasticsearch/ca.crt}
              - {key: networker-chnl-ca-crt, path: networker/chnl/ca.crt}
              - {key: networker-chnl-username, path: networker/chnl/username}
              - {key: networker-chnl-password, path: networker/chnl/password}
---
apiVersion: v1
kind: Service
metadata:
  name: backup-dashboard-collector-networker-chnl
  labels:
    app: backup-dashboard-collector
    collector-group: networker
    networker-server: chnl
spec:
  selector:
    app: backup-dashboard-collector
    collector-group: networker
    networker-server: chnl
  ports:
    - {name: http, port: 8080, targetPort: http}
