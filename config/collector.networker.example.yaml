app:
  name: backup-dashboard-collector-networker
  log_level: INFO

elasticsearch:
  enabled: false
  hosts:
    - https://elasticsearch:9200
  index_prefix: backup-dashboard
  username: elasticsearch_username_TO_BE_FILLED
  password: elasticsearch_password_TO_BE_FILLED
  verify_certs: true
  ca_certs: /apps/secrets/elasticsearch/ca.crt

collectors:
  - name: networker_core
    type: Networker
    protocol: rest
    enabled: true
    schedule:
      fast:
        interval_minutes: 5
        minute_offset: 3
        second: 0
      slow:
        interval_minutes: 60
        minute_offset: 3
        second: 30
    base_url: networker_core_base_url_TO_BE_FILLED
    method: GET
    token: networker_core_token_TO_BE_FILLED
    username: networker_core_username_TO_BE_FILLED
    password: networker_core_password_TO_BE_FILLED
    verify_tls: true
    rest:
      max_concurrency: 4
    source_networker: core
    classification:
      hostname_csv_path: /apps/config/hostname_domain.csv
      allowed_domains: [core, chnl, info, ifrs]
      unmapped_domain: unmapped

  - name: networker_chnl
    type: Networker
    protocol: rest
    enabled: true
    schedule:
      fast:
        interval_minutes: 5
        minute_offset: 3
        second: 0
      slow:
        interval_minutes: 60
        minute_offset: 3
        second: 30
    base_url: networker_chnl_base_url_TO_BE_FILLED
    method: GET
    token: networker_chnl_token_TO_BE_FILLED
    username: networker_chnl_username_TO_BE_FILLED
    password: networker_chnl_password_TO_BE_FILLED
    verify_tls: true
    rest:
      max_concurrency: 4
    source_networker: chnl
    classification:
      hostname_csv_path: /apps/config/hostname_domain.csv
      allowed_domains: [core, chnl, info, ifrs]
      unmapped_domain: unmapped

  - name: networker_info
    type: Networker
    protocol: rest
    enabled: true
    schedule:
      fast:
        interval_minutes: 5
        minute_offset: 3
        second: 0
      slow:
        interval_minutes: 60
        minute_offset: 3
        second: 30
    base_url: networker_info_base_url_TO_BE_FILLED
    method: GET
    token: networker_info_token_TO_BE_FILLED
    username: networker_info_username_TO_BE_FILLED
    password: networker_info_password_TO_BE_FILLED
    verify_tls: true
    rest:
      max_concurrency: 4
    source_networker: info
    classification:
      hostname_csv_path: /apps/config/hostname_domain.csv
      allowed_domains: [core, chnl, info, ifrs]
      unmapped_domain: unmapped

  - name: networker_ifrs
    type: Networker
    protocol: rest
    enabled: true
    schedule:
      fast:
        interval_minutes: 5
        minute_offset: 3
        second: 0
      slow:
        interval_minutes: 60
        minute_offset: 3
        second: 30
    base_url: networker_ifrs_base_url_TO_BE_FILLED
    method: GET
    token: networker_ifrs_token_TO_BE_FILLED
    username: networker_ifrs_username_TO_BE_FILLED
    password: networker_ifrs_password_TO_BE_FILLED
    verify_tls: true
    rest:
      max_concurrency: 4
    source_networker: ifrs
    classification:
      hostname_csv_path: /apps/config/hostname_domain.csv
      allowed_domains: [core, chnl, info, ifrs]
      unmapped_domain: unmapped
